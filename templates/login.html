<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Streamer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #030712; }
        .glass {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-100">
    <div class="w-full max-w-md px-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="2"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M21.17 19H2.83"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Streamer Pro</h1>
            <p class="text-gray-500 text-sm mt-1">Facebook Live Streaming Platform</p>
        </div>

        <div class="glass rounded-2xl p-8 shadow-2xl">
            {% if not_configured %}
            <div class="text-center space-y-3">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-yellow-500/10 text-yellow-400 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <h2 class="font-bold text-lg">Setup Required</h2>
                <p class="text-gray-400 text-sm leading-relaxed">
                    Please set <code class="text-yellow-400 bg-gray-900 px-1 rounded">ADMIN_USERNAME</code> and
                    <code class="text-yellow-400 bg-gray-900 px-1 rounded">ADMIN_PASSWORD</code> in your
                    Replit Secrets, then restart the app.
                </p>
            </div>
            {% else %}
            <h2 class="text-xl font-bold mb-6">Sign In</h2>

            {% if error %}
            <div class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Username</label>
                    <input
                        type="text"
                        name="username"
                        required
                        autofocus
                        autocomplete="username"
                        class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-700"
                        placeholder="admin"
                    >
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
                    <input
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-700"
                        placeholder="••••••••"
                    >
                </div>
                <button
                    type="submit"
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold transition-all active:scale-95"
                >
                    Sign In
                </button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
